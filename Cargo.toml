[package]
name = "qwato"
version = "0.1.0"
edition = "2024"
description = "CLI: Write a Memo for your notes in the terminal."
categories = ["command-line-utilities"]
keywords = ["cli", "markdown", "journal", "note-taking", "obsidian"]
readme = "README.md"
authors = ["ikata"]
repository = "https://github.com/c0b23092db/qwato"

[[bin]]
name = "qwa"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
opt-level = "s"
debug = false
panic = "abort"
codegen-units = 1

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
chrono = "0.4.45"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
dirs = "6.0.0"
regex = "1.13.1"
colored = "3.1.1"
