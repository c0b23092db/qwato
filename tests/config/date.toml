base_directory = "./tests"
default_command = "line"
date_format = "line"

[list]
limit = 10

[command.line]
directory = "target/line"
file = "%Y-%m-%d.md"

[command.slash]
date_format = "slash"
directory = "target/slash"
file = "%Y/%m/%d.md"

[command.header]
date_format = "header"
directory = "target/header"
file = "header.md"
insert = "## %Y-%m-%d"
