name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  BINARY_NAME: qwa

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: qwa-linux-x86_64.tar.gz
            binary: qwa

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: qwa-windows-x86_64.zip
            binary: qwa.exe

          - os: macos-latest
            target: x86_64-apple-darwin
            archive: qwa-macos-x86_64.tar.gz
            binary: qwa

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux

          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ env.BINARY_NAME }}"

          tar -C dist -czf "${{ matrix.archive }}" "${{ env.BINARY_NAME }}"
          sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - name: Package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item `
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" `
            "dist/${{ env.BINARY_NAME }}.exe"

          Compress-Archive `
            -Path "dist/${{ env.BINARY_NAME }}.exe" `
            -DestinationPath "${{ matrix.archive }}"

          (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower() `
            + "  ${{ matrix.archive }}" `
            | Out-File "${{ matrix.archive }}.sha256" -Encoding ascii

      - name: Prepare standalone executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "dist/qwa.exe" "qwa.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
            ${{ env.BINARY_NAME }}${{ runner.os == 'Windows' && '.exe' || '' }}

  release:
    - name: Set version
      shell: bash
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Version ${{ env.VERSION }}
        generate_release_notes: true
        files: release-assets/*

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*