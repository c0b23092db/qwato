name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BINARY_NAME: qwa

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: qwa-linux-x86_64.tar.gz
            binary: qwa

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: qwa-windows-x86_64.zip
            binary: qwa.exe

          - os: macos-latest
            target: x86_64-apple-darwin
            archive: qwa-macos-x86_64.tar.gz
            binary: qwa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux

          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "dist/${{ env.BINARY_NAME }}"

          tar -C dist \
            -czf "${{ matrix.archive }}" \
            "${{ env.BINARY_NAME }}"

          sha256sum "${{ matrix.archive }}" \
            > "${{ matrix.archive }}.sha256"

      - name: Package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item `
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" `
            "dist/${{ env.BINARY_NAME }}.exe"

          Compress-Archive `
            -Path "dist/${{ env.BINARY_NAME }}.exe" `
            -DestinationPath "${{ matrix.archive }}"

          (Get-FileHash "${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower() `
            + "  ${{ matrix.archive }}" `
            | Out-File "${{ matrix.archive }}.sha256" -Encoding ascii

      - name: Prepare standalone executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "dist/qwa.exe" "qwa.exe"

          (Get-FileHash "qwa.exe" -Algorithm SHA256).Hash.ToLower() `
            + "  qwa.exe" `
            | Out-File "qwa.exe.sha256" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
            qwa.exe
            qwa.exe.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Version ${{ env.VERSION }}
          generate_release_notes: true
          files: release-assets/*